; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
platform_packages =
	framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
extra_scripts = pre:scripts/generate_gatt.py

; Robot 0 is the instructor's robot
[env:robot_0]
build_flags = -D ROBOT_ID=0 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_1]
build_flags = -D ROBOT_ID=1 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_2]
build_flags = -D ROBOT_ID=2 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_3]
build_flags = -D ROBOT_ID=3 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_4]
build_flags = -D ROBOT_ID=4 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_5]
build_flags = -D ROBOT_ID=5 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false

[env:robot_6]
build_flags = -D ROBOT_ID=6 -D SWAP_LEFT_RIGHT=false -D DRIVE_REVERSED=false
